name: Vitest consumer compatibility

on:
  pull_request:
    paths:
      - 'packages/vitest-angular/**'
      - 'packages/vitest-angular-tools/**'
      - 'packages/create-analog/**'
      - 'packages/nx-plugin/**'
      - 'packages/vite-plugin-angular/**'
      - 'tools/scripts/vitest-consumer-smoke.mjs'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vitest-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: 'Vitest 5 generated starters',
              case: templates,
              vitest: '5.0.0',
              vite: workspace,
            }
          - {
              name: 'Vitest 5 Angular builders and browser',
              case: builders,
              vitest: '5.0.0',
              vite: workspace,
            }
          - {
              name: 'Vitest 4 retained builder compatibility',
              case: builders,
              vitest: '4.1.4',
              vite: workspace,
            }
          - {
              name: 'Vitest 5 Vite 7 esbuild integration',
              case: templates,
              vitest: '5.0.0',
              vite: '7.0.0',
            }
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.31.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Qualify installed consumers
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: pnpm exec nx run vitest-angular:consumer-smoke --case=${{ matrix.case }} --vitest=${{ matrix.vitest }} --vite=${{ matrix.vite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-${{ matrix.vitest }}-${{ matrix.case }}-vite-${{ matrix.vite }}
          path: |
            dist/vitest-consumer-smoke/**/result.json
            dist/vitest-consumer-smoke/**/pnpm-lock.yaml
          if-no-files-found: warn
