# Re-verifies the grafts in .grafts/ when their upstream packages release.
# A graft that still fits opens a PR with the bump (ci.yml checks behavior);
# one that needs an agent or a human opens an issue with the sync report.
#
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". Otherwise the action pushes the branch and opens an
# issue with a link to open the PR.
name: Graft sync

on:
  schedule:
    - cron: '30 11 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency: graft-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.31.0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      # TRIAL (not for merge): run the nx upgrade through Graft with nx's agentic migrations,
      # and show what it did. Nothing is pushed.
      - name: Check the agent's key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY" || { echo "::error::Add the ANTHROPIC_API_KEY repository secret"; exit 1; }
      - run: npm install --global @anthropic-ai/claude-code
      - name: Git identity for nx's migration commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: graft sync nx 24.0.6 (agentic)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: time npx -y @graftsync/cli@0.2.7 sync --version 24.0.6 --install
      - name: What changed
        if: always()
        run: |
          cat .grafts/.report/sync.md || true
          git log --oneline ${{ github.sha }}..HEAD
          git status --short
          git diff --stat ${{ github.sha }}
          git diff ${{ github.sha }} -- . ':!pnpm-lock.yaml' | head -400
          find tools/ai-migrations -type f -print 2>/dev/null || true
          ls .nx/migrate-runs 2>/dev/null && cat .nx/migrate-runs/*/RUNBOOK.md 2>/dev/null | head -200 || true
