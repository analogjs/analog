name: Nitro integration conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/platform/**'
      - 'packages/vite-plugin-nitro/**'
      - 'pnpm-lock.yaml'
      - 'tools/scripts/nitro-*.mts'
      - 'tools/fixtures/nitro-patches/**'
      - 'patches/**'
      - '.github/workflows/nitro-conformance.yml'

jobs:
  nitro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run platform:nitro-conformance --skip-nx-cache
      - run: pnpm nx run platform:nitro-patches
      - run: pnpm nx run platform:nitro-cloudflare --skip-nx-cache
